name: "notebook checks"

on:
  push:
    branches:
      - develop
      - "pre/**"
  pull_request:
    branches:
      - develop
      - "pre/**"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  lint:
    name: Run notebook checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # required for changed-files action

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Run ruff format check
        id: ruff_format
        continue-on-error: true
        run: uvx ruff format --check --diff .

      - name: Run ruff lint check
        id: ruff_check
        continue-on-error: true
        run: uvx ruff check .

      - name: Get changed notebook files
        id: changed_notebooks
        uses: tj-actions/changed-files@v46
        with:
          files: |
            *.ipynb

      - name: Check metadata tag catalog is up to date
        id: metadata_tags
        continue-on-error: true
        run: uv run --no-project python scripts/sync_metadata_tags.py --check

      - name: Check changed notebooks for metadata format
        id: notebook_metadata
        if: steps.changed_notebooks.outputs.any_changed == 'true'
        continue-on-error: true
        run: |
          uv run --no-project python scripts/validate_notebook_metadata.py ${{ steps.changed_notebooks.outputs.all_changed_files }}

      - name: Check misc file references
        id: misc_refs
        continue-on-error: true
        run: python3 misc/check_misc_references.py

      - name: Run spell check on changed notebooks
        id: spellcheck
        if: github.event_name == 'pull_request' && steps.changed_notebooks.outputs.any_changed == 'true'
        continue-on-error: true
        run: |
          uv run spellcheck.py ${{ steps.changed_notebooks.outputs.all_changed_files }} > spellcheck_output.txt || true

      - name: Prepare spellcheck comment body
        id: prepare_comment
        if: >
          github.event_name == 'pull_request' &&
          steps.changed_notebooks.outputs.any_changed == 'true' &&
          steps.spellcheck.outcome == 'success' &&
          hashFiles('spellcheck_output.txt') != ''
        run: |
          echo "<!-- lint-notebooks-spellcheck-comment -->" > comment_body.txt
          echo "" >> comment_body.txt
          cat spellcheck_output.txt >> comment_body.txt
          echo "Generated by GitHub Action run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> comment_body.txt

      - name: Find existing comment
        uses: peter-evans/find-comment@v3
        id: find_comment
        if: steps.prepare_comment.outcome == 'success'
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: '<!-- lint-notebooks-spellcheck-comment -->'

      - name: Post or Update spell check comment
        if: steps.prepare_comment.outcome == 'success'
        uses: peter-evans/create-or-update-comment@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          issue-number: ${{ github.event.pull_request.number }}
          comment-id: ${{ steps.find_comment.outputs.comment-id }}
          body-path: comment_body.txt
          edit-mode: replace

      - name: Fail if blocking checks failed
        if: always()
        run: |
          failed=0

          if [ "${{ steps.ruff_format.outcome }}" = "failure" ]; then
            echo "Blocking check failed: ruff format"
            failed=1
          fi

          if [ "${{ steps.ruff_check.outcome }}" = "failure" ]; then
            echo "Blocking check failed: ruff lint"
            failed=1
          fi

          if [ "${{ steps.metadata_tags.outcome }}" = "failure" ]; then
            echo "Blocking check failed: metadata tag catalog drift"
            failed=1
          fi

          if [ "${{ steps.notebook_metadata.outcome }}" = "failure" ]; then
            echo "Blocking check failed: changed notebook metadata validation"
            failed=1
          fi

          if [ "${{ steps.misc_refs.outcome }}" = "failure" ]; then
            echo "Blocking check failed: misc file references"
            failed=1
          fi

          exit "$failed"
