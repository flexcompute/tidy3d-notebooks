name: "notebooks-linting"

on:
  workflow_dispatch:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint:
    name: Run notebook linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      
      - uses: astral-sh/ruff-action@v3
        with:
          version: 0.5.5
      
      - name: Run ruff format
        run: ruff format --check --diff .
      
      - name: Run ruff check
        run: ruff check .
