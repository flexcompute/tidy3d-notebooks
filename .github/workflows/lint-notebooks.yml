name: "public/tidy3d/lint-notebooks"

on:
  workflow_dispatch:
  # pull_request: # skip for the big migration
  #  branches:
  #    - main
  #  types: ['opened', 'reopened', 'synchronize', 'ready_for_review', 'edited']
  #  paths:
  #    - 'public/tidy3d/docs/notebooks/**'
  #    - '.github/workflows/public_tidy3d-*.yml'

permissions:
  contents: read
  pull-requests: write

jobs:
  lint:
    name: Run notebook linting and spell check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: public/tidy3d/docs/notebooks
    steps:
      - name: generate-app-token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.COPYBARA_APP_ID }}
          private-key: ${{ secrets.COPYBARA_APP_PRIVATE_KEY }}
          repositories: flex
          owner: flexcompute

      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 #v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0  # required for changed-files action
          submodules: false
          persist-credentials: false
          lfs: true
          sparse-checkout: |
            public/tidy3d/docs/notebooks
            .github/workflows
          sparse-checkout-cone-mode: false
      
      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Run ruff format check
        run: uvx ruff format --check --diff .

      - name: Run ruff lint check
        run: uvx ruff check .

      - name: Check misc file references
        run: python3 misc/check_misc_references.py

      - name: Get changed notebook files
        id: changed_notebooks
        if: github.event_name == 'pull_request'
        uses: tj-actions/changed-files@v46
        with:
          files: |
            **.ipynb

      - name: Run spell check on changed notebooks
        id: spellcheck
        if: github.event_name == 'pull_request' && steps.changed_notebooks.outputs.any_changed == 'true'
        continue-on-error: true
        run: |
          # Strip working-directory prefix from paths since changed-files returns repo-relative paths
          RELATIVE_PATHS=$(echo "${{ steps.changed_notebooks.outputs.all_changed_files }}" | sed 's|public/tidy3d/docs/notebooks/||g')
          uv run spellcheck.py $RELATIVE_PATHS > spellcheck_output.txt || true

      - name: Prepare spellcheck comment body
        id: prepare_comment
        if: >
          github.event_name == 'pull_request' &&
          steps.changed_notebooks.outputs.any_changed == 'true' &&
          steps.spellcheck.outcome == 'success' &&
          hashFiles('public/tidy3d/docs/notebooks/spellcheck_output.txt') != ''
        run: |
          echo "<!-- lint-notebooks-spellcheck-comment -->" > comment_body.txt
          echo "" >> comment_body.txt
          cat spellcheck_output.txt >> comment_body.txt
          echo "Generated by GitHub Action run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> comment_body.txt

      - name: Find existing comment
        uses: peter-evans/find-comment@v3
        id: find_comment
        if: steps.prepare_comment.outcome == 'success'
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: '<!-- lint-notebooks-spellcheck-comment -->'

      - name: Post or Update spell check comment
        if: steps.prepare_comment.outcome == 'success'
        uses: peter-evans/create-or-update-comment@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          issue-number: ${{ github.event.pull_request.number }}
          comment-id: ${{ steps.find_comment.outputs.comment-id }}
          body-path: public/tidy3d/docs/notebooks/comment_body.txt
          edit-mode: replace
